<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 760 236" width="760" height="236" font-family="Inter,'IBM Plex Sans Thai','DejaVu Sans',sans-serif"><rect x="24.0" y="84.0" width="170.00" height="108.0" rx="8" fill="#2f6db5" fill-opacity="0.12" stroke="#2f6db5" stroke-width="2"/><text x="36.0" y="108.0" font-size="13" font-weight="600" text-anchor="start" fill="#1f2328">0 Prepare</text><text x="36.0" y="126.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#5f6368">Months 0–12</text><text x="36.0" y="150.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2328">Run flagship studies</text><text x="36.0" y="168.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2328">Enact law; AML package</text><rect x="204.0" y="84.0" width="170.00" height="108.0" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"/><text x="216.0" y="108.0" font-size="13" font-weight="600" text-anchor="start" fill="#1f2328">1 Stop printing</text><text x="216.0" y="126.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#5f6368">Years 1–2</text><text x="216.0" y="150.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2328">ATMs switch to THB 500</text><text x="216.0" y="168.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2328">Cash-payment cap starts</text><rect x="384.0" y="84.0" width="170.00" height="108.0" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"/><text x="396.0" y="108.0" font-size="13" font-weight="600" text-anchor="start" fill="#1f2328">2 Withdraw</text><text x="396.0" y="126.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#5f6368">Years 2–5</text><text x="396.0" y="150.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2328">Banks stop reissuing</text><text x="396.0" y="168.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2328">Help desks for elderly</text><rect x="564.0" y="84.0" width="170.00" height="108.0" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"/><text x="576.0" y="108.0" font-size="13" font-weight="600" text-anchor="start" fill="#1f2328">3 End legal tender</text><text x="576.0" y="126.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#5f6368">After year 5</text><text x="576.0" y="150.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2328">Redeemable at the BOT</text><text x="576.0" y="168.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2328">Source of funds checked</text><path d="M199.0 128.0l10 10l-10 10l-10 -10z" fill="#f1f3f5" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25" stroke-opacity="1"/><text x="199.0" y="216.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1f2328">Gate 1: evidence shows</text><text x="199.0" y="232.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#5f6368">the note is the problem</text><path d="M379.0 128.0l10 10l-10 10l-10 -10z" fill="#f1f3f5" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25" stroke-opacity="1"/><text x="379.0" y="216.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1f2328">Gate 2: liquidity normal</text><text x="379.0" y="232.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#5f6368">and 1,000s falling</text><path d="M559.0 128.0l10 10l-10 10l-10 -10z" fill="#f1f3f5" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25" stroke-opacity="1"/><text x="559.0" y="216.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1f2328">Gate 3: under 10% of</text><text x="559.0" y="232.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#5f6368">1,000s remain</text><rect x="24.0" y="258.0" width="710.00" height="36.0" rx="8" fill="#f1f3f5" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"/><text x="379.0" y="281.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2328">Throughout: independent annual evaluation and monthly open data on banknotes by denomination</text></svg>