<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 60 760 380" width="760" height="380" font-family="Inter,'IBM Plex Sans Thai','DejaVu Sans',sans-serif"><path d="M300 148L200 330" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25" stroke-opacity="1"/><path d="M460 148L560 330" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25" stroke-opacity="1"/><path d="M276 368H484" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25" stroke-opacity="1"/><rect x="262.0" y="72.0" width="236.00" height="76.0" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"/><text x="380.0" y="96.0" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">Bite</text><text x="380.0" y="116.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2328">Destroys or seizes illicit cash</text><text x="380.0" y="134.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#5f6368">needs surprise, short window</text><rect x="40.0" y="330.0" width="236.00" height="76.0" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"/><text x="158.0" y="354.0" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">Smoothness</text><text x="158.0" y="374.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2328">Low cost to honest holders</text><text x="158.0" y="392.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#5f6368">needs notice, long window</text><rect x="484.0" y="330.0" width="236.00" height="76.0" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"/><text x="602.0" y="354.0" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">Integrity</text><text x="602.0" y="374.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2328">No laundering via the exchange</text><text x="602.0" y="392.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#5f6368">needs scrutiny of every deposit</text><text x="228.0" y="226.0" font-size="11.5" font-weight="600" text-anchor="end" fill="#1f2328">No real-world example</text><text x="228.0" y="242.0" font-size="11.5" font-weight="400" text-anchor="end" fill="#5f6368">requires knowing who holds it</text><text x="536.0" y="222.0" font-size="11.5" font-weight="600" text-anchor="start" fill="#1f2328">Shock + full scrutiny</text><text x="536.0" y="238.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#5f6368">bite and integrity, but the</text><text x="536.0" y="254.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#5f6368">highest burden on the honest</text><text x="380.0" y="392.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1f2328">Gradual phase-out</text><text x="380.0" y="408.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#5f6368">smooth and clean, no bite</text><text x="380.0" y="424.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#5f6368">euro area, Canada, Singapore</text><circle cx="380.0" cy="204.0" r="4" fill="#8a8f98" fill-opacity="1" stroke="none" stroke-width="1.5"/><text x="380.0" y="228.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1f2328">India 2016</text><text x="380.0" y="244.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#5f6368">aimed to bite; 99.3% returned</text><text x="380.0" y="260.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#5f6368">and lost smoothness and integrity</text></svg>